default_language_version:
  python: python3.12

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml

exclude: |
  (^\.env$)|
  (^\.env\.)|
  (file-env\.example)|
  (^variables\.yml$)|
  (^\.vscode$)|
  (^docker-compose\.yml$)|
  (^docker$)|
  (^\.github$)
