services:
  db:
    image: postgres:16.11
    env_file:
      - ./.env/.db
    volumes:
      - finanzas:/var/lib/postgresql/data
  web:
    build: .
    command: >
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
    env_file:
      - api/.env
    ports:
      - "8000:8000"
    depends_on:
      - db